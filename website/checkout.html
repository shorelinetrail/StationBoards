<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - StationBoards</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .checkout-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 2rem;
    }

    .checkout-form {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .order-summary {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .form-section h3 {
      margin-bottom: 1rem;
      color: #1a202c;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #4a5568;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .quantity-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quantity-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .quantity-value {
      font-size: 1.5rem;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .product-card {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .product-image {
      width: 80px;
      height: 80px;
      background: #e2e8f0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .product-details {
      flex: 1;
    }

    .product-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .product-description {
      font-size: 0.875rem;
      color: #718096;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      color: #4a5568;
    }

    .price-row.total {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      padding-top: 1rem;
      border-top: 2px solid #e2e8f0;
      margin-top: 1rem;
    }

    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    .payment-btn {
      padding: 1rem;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .payment-btn:hover {
      border-color: #667eea;
      background: #f7fafc;
    }

    .payment-btn.paypal {
      background: #0070ba;
      color: white;
      border-color: #0070ba;
    }

    .payment-btn.paypal:hover {
      background: #005ea6;
    }

    .payment-btn.stripe {
      background: #635bff;
      color: white;
      border-color: #635bff;
    }

    .payment-btn.stripe:hover {
      background: #4f46e5;
    }

    .payment-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      border: 2px solid #f56565;
      color: #c53030;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .trust-badges {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.875rem;
      color: #718096;
    }

    @media (max-width: 968px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }

      .order-summary {
        position: static;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <span class="logo">🚉</span>
        <span class="brand-name">StationBoards.co.uk</span>
      </div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/track.html">Track Order</a>
      </div>
    </div>
  </nav>

  <div class="checkout-container">
    <!-- Checkout Form -->
    <div class="checkout-form">
      <h2 style="margin-bottom: 2rem;">Checkout</h2>

      <div id="errorContainer"></div>

      <form id="checkoutForm">
        <!-- Customer Information -->
        <div class="form-section">
          <h3>Customer Information</h3>

          <div class="form-group">
            <label for="customerName">Full Name *</label>
            <input type="text" id="customerName" required placeholder="John Smith">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="customerEmail">Email *</label>
              <input type="email" id="customerEmail" required placeholder="john@example.com">
            </div>

            <div class="form-group">
              <label for="customerPhone">Phone</label>
              <input type="tel" id="customerPhone" placeholder="07700 900000">
            </div>
          </div>
        </div>

        <!-- Shipping Address -->
        <div class="form-section">
          <h3>Shipping Address</h3>

          <div class="form-group">
            <label for="shippingAddress">Address Line 1 *</label>
            <input type="text" id="shippingAddress" required placeholder="123 Main Street">
          </div>

          <div class="form-group">
            <label for="shippingAddress2">Address Line 2</label>
            <input type="text" id="shippingAddress2" placeholder="Apartment, suite, etc.">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="shippingCity">City *</label>
              <input type="text" id="shippingCity" required placeholder="London">
            </div>

            <div class="form-group">
              <label for="shippingPostcode">Postcode *</label>
              <input type="text" id="shippingPostcode" required placeholder="SW1A 1AA">
            </div>
          </div>

          <div class="form-group">
            <label for="shippingCountry">Country *</label>
            <select id="shippingCountry" required>
              <option value="United Kingdom">United Kingdom</option>
              <option value="Ireland">Ireland</option>
            </select>
          </div>
        </div>

        <!-- Additional Notes -->
        <div class="form-section">
          <div class="form-group">
            <label for="orderNotes">Order Notes (Optional)</label>
            <textarea id="orderNotes" rows="3" placeholder="Any special instructions or station preferences..."></textarea>
          </div>
        </div>
      </form>
    </div>

    <!-- Order Summary -->
    <div class="order-summary">
      <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>

      <div class="product-card">
        <div class="product-image">🚉</div>
        <div class="product-details">
          <div class="product-title">StationBoard</div>
          <div class="product-description">Live departure display with OLED screen</div>
        </div>
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <div class="quantity-selector">
          <button type="button" class="quantity-btn" onclick="changeQuantity(-1)">−</button>
          <div class="quantity-value" id="quantity">1</div>
          <button type="button" class="quantity-btn" onclick="changeQuantity(1)">+</button>
        </div>
      </div>

      <div style="margin-top: 2rem;">
        <div class="price-row">
          <span>Subtotal</span>
          <span id="subtotal">£89.00</span>
        </div>
        <div class="price-row">
          <span>Shipping</span>
          <span>FREE</span>
        </div>
        <div class="price-row total">
          <span>Total</span>
          <span id="total">£89.00</span>
        </div>
      </div>

      <div class="payment-methods">
        <button type="button" class="payment-btn paypal" id="paypalBtn" onclick="payWithPayPal()">
          <span style="font-size: 1.5rem;">PayPal</span>
        </button>

        <button type="button" class="payment-btn stripe" id="stripeBtn" onclick="payWithStripe()">
          <span>💳</span>
          <span>Pay with Card</span>
        </button>
      </div>

      <div class="trust-badges">
        <span>🔒 Secure Checkout</span>
        <span>📦 Free UK Shipping</span>
      </div>
    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const PRICE_PER_UNIT = 89.00;
    let quantity = 1;

    // Change quantity
    function changeQuantity(delta) {
      quantity = Math.max(1, Math.min(10, quantity + delta));
      document.getElementById('quantity').textContent = quantity;
      updateTotal();
    }

    // Update total
    function updateTotal() {
      const subtotal = PRICE_PER_UNIT * quantity;
      document.getElementById('subtotal').textContent = `£${subtotal.toFixed(2)}`;
      document.getElementById('total').textContent = `£${subtotal.toFixed(2)}`;
    }

    // Validate form
    function validateForm() {
      const form = document.getElementById('checkoutForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return false;
      }
      return true;
    }

    // Get form data
    function getFormData() {
      const address2 = document.getElementById('shippingAddress2').value;
      const address = document.getElementById('shippingAddress').value +
                     (address2 ? '\n' + address2 : '');

      return {
        customer_name: document.getElementById('customerName').value,
        customer_email: document.getElementById('customerEmail').value,
        customer_phone: document.getElementById('customerPhone').value || null,
        shipping_address: address,
        shipping_city: document.getElementById('shippingCity').value,
        shipping_postcode: document.getElementById('shippingPostcode').value,
        shipping_country: document.getElementById('shippingCountry').value,
        quantity: quantity,
        total_price: PRICE_PER_UNIT * quantity,
        notes: document.getElementById('orderNotes').value || null
      };
    }

    // Pay with PayPal
    async function payWithPayPal() {
      if (!validateForm()) return;

      const btn = document.getElementById('paypalBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const formData = getFormData();

        // Create order in database
        const orderResponse = await fetch('/api/submit-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const orderData = await orderResponse.json();

        if (!orderData.success) {
          throw new Error(orderData.error || 'Failed to create order');
        }

        // Create PayPal order
        const paypalResponse = await fetch('/api/create-paypal-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            order_id: orderData.order.id,
            order_number: orderData.order.order_number,
            customer_email: formData.customer_email,
            customer_name: formData.customer_name,
            quantity: formData.quantity,
            total_price: formData.total_price
          })
        });

        const paypalData = await paypalResponse.json();

        if (!paypalData.success) {
          throw new Error(paypalData.error || 'Failed to create PayPal order');
        }

        // Redirect to PayPal
        window.location.href = paypalData.approval_url;

      } catch (error) {
        document.getElementById('errorContainer').innerHTML = `
          <div class="error-message">
            ${error.message}
          </div>
        `;
        btn.disabled = false;
        btn.innerHTML = '<span style="font-size: 1.5rem;">PayPal</span>';
      }
    }

    // Pay with Stripe
    async function payWithStripe() {
      if (!validateForm()) return;

      const btn = document.getElementById('stripeBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const formData = getFormData();

        // Create order in database
        const orderResponse = await fetch('/api/submit-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const orderData = await orderResponse.json();

        if (!orderData.success) {
          throw new Error(orderData.error || 'Failed to create order');
        }

        // Create Stripe checkout session
        const stripeResponse = await fetch('/api/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            order_id: orderData.order.id,
            order_number: orderData.order.order_number,
            customer_email: formData.customer_email,
            customer_name: formData.customer_name,
            quantity: formData.quantity,
            total_price: formData.total_price
          })
        });

        const stripeData = await stripeResponse.json();

        if (!stripeData.success) {
          throw new Error(stripeData.error || 'Failed to create Stripe session');
        }

        // Redirect to Stripe
        window.location.href = stripeData.checkout_url;

      } catch (error) {
        document.getElementById('errorContainer').innerHTML = `
          <div class="error-message">
            ${error.message}
          </div>
        `;
        btn.disabled = false;
        btn.innerHTML = '<span>💳</span><span>Pay with Card</span>';
      }
    }
  </script>
</body>
</html>
