<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - StationBoards</title>
  <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-container">
    <div class="login-box">
      <h1>🚉 StationBoards Admin</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
        <p id="loginError" class="error-message"></p>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" style="display: none;">
    <!-- Header -->
    <header class="admin-header">
      <div class="header-content">
        <div class="logo">🚉 StationBoards Admin</div>
        <div class="header-actions">
          <span id="userEmail" class="user-email"></span>
          <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="orders">Orders</button>
      <button class="tab" data-tab="boards">Boards</button>
      <button class="tab" data-tab="shipping">Shipping</button>
    </nav>

    <!-- Orders Tab -->
    <div id="ordersTab" class="tab-content active">
      <div class="container">
        <div class="page-header">
          <h2>Orders</h2>
          <div class="filters">
            <select id="statusFilter" class="filter-select">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <input type="search" id="searchOrders" placeholder="Search orders..." class="search-input">
          </div>
        </div>

        <div class="orders-list" id="ordersList">
          <!-- Orders will be loaded here -->
          <p class="loading">Loading orders...</p>
        </div>
      </div>
    </div>

    <!-- Boards Tab -->
    <div id="boardsTab" class="tab-content">
      <div class="container">
        <div class="page-header">
          <h2>Boards Inventory</h2>
          <button id="addBoardBtn" class="btn-primary">+ Add Board</button>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-value" id="totalBoards">0</div>
            <div class="stat-label">Total Boards</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="inStockBoards">0</div>
            <div class="stat-label">In Stock</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="assignedBoards">0</div>
            <div class="stat-label">Assigned</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="activeBoards">0</div>
            <div class="stat-label">Active</div>
          </div>
        </div>

        <div class="boards-table" id="boardsTable">
          <!-- Boards will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Shipping Tab -->
    <div id="shippingTab" class="tab-content">
      <div class="container">
        <h2>Shipping Management</h2>
        <p>Royal Mail integration coming soon...</p>
      </div>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalOrderNumber">Order Details</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="orderModalBody">
        <!-- Order details will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Add Board Modal -->
  <div id="addBoardModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Board</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addBoardForm">
          <div class="form-group">
            <label for="newBoardId">Board ID *</label>
            <input type="text" id="newBoardId" required placeholder="e.g., ESP32-A1B2C3D4">
          </div>
          <div class="form-group">
            <label for="firmwareVersion">Firmware Version</label>
            <input type="text" id="firmwareVersion" placeholder="e.g., 2.0.0">
          </div>
          <div class="form-group">
            <label for="hardwareRevision">Hardware Revision</label>
            <input type="text" id="hardwareRevision" placeholder="e.g., v1.2">
          </div>
          <div class="form-group">
            <label for="manufacturedDate">Manufactured Date</label>
            <input type="date" id="manufacturedDate">
          </div>
          <div class="form-group">
            <label for="boardNotes">Notes</label>
            <textarea id="boardNotes" rows="3"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary modal-close">Cancel</button>
            <button type="submit" class="btn-primary">Add Board</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/admin-script.js"></script>
</body>
</html>
